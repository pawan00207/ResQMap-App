                    </p>
</div>

<div class="flex justify-between gap-2 md:gap-4">
<!-- Six Individual OTP Inputs -->
<input aria-label="Digit 1" class="w-12 h-16 md:w-14 md:h-18 text-center text-2xl font-bold rounded-lg border-0 bg-surface-container-highest text-primary focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 2" class="w-12 h-16 md:w-14 md:h-18 text-center text-2xl font-bold rounded-lg border-0 bg-surface-container-highest text-primary focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 3" class="w-12 h-16 md:w-14 md:h-18 text-center text-2xl font-bold rounded-lg border-0 bg-surface-container-highest text-primary focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>

<input aria-label="Digit 5" class="w-12 h-16 md:w-14 md:h-18 text-center text-2xl font-bold rounded-lg border-0 bg-surface-container-highest text-primary focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 6" class="w-12 h-16 md:w-14 md:h-18 text-center text-2xl font-bold rounded-lg border-0 bg-surface-container-highest text-primary focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
</div>
<!-- Main Action -->
<div class="space-y-6">
<button class="w-full h-14 cta-gradient text-on-primary font-bold rounded-lg flex items-center justify-center gap-2 shadow-lg transition-transform duration-150" type="submit">
<span>Verify &amp; Login</span>
<span class="material-symbols-outlined text-xl" data-icon="login">login</span>
</button>
<!-- Secondary Actions / Resend -->
<div class="flex flex-col items-center gap-2">
<div class="flex items-center gap-2 text-xs font-medium uppercase tracking-widest text-on-surface-variant">
<span>Code expires in</span>
<span class="text-secondary font-bold">59s</span>
</div>
<button class="text-sm font-semibold text-primary hover:text-on-primary-fixed-variant transition-colors flex items-center gap-1" type="button">
<span>Resend Code</span>
<span class="material-symbols-outlined text-sm" data-icon="refresh">refresh</span>
</button>
</div>
</div>
</form>
</section>
